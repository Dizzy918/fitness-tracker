name: FitnessTracker
options:
  bundleIdPrefix: com.slavov
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  FitDataProtocol:
    url: https://github.com/FitnessKit/FitDataProtocol
    from: 2.1.6
  AntMessageProtocol:
    url: https://github.com/FitnessKit/AntMessageProtocol
    from: 1.1.1
  # Transitive, but linked explicitly: Measurement<UnitCadence> from this module
  # appears in our own symbols, so the app must link it directly.
  FitnessUnits:
    url: https://github.com/FitnessKit/FitnessUnits
    from: 3.1.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    # Extract every localizable literal at compile time into .stringsdata, which
    # is what populates the String Catalog. Without it the catalog only ever
    # contains what someone typed into it by hand.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Ad-hoc signing by default. Automatic signing with an empty DEVELOPMENT_TEAM
    # fails the build outright, which broke `xcodebuild … test` — the command the
    # README documents — for anyone who hadn't opened Xcode first. Ad-hoc is
    # enough for the sandboxed macOS app, the test bundle and the iOS Simulator.
    # To run on a real device, switch the target to Automatic and pick your Team.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  FitnessTracker:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FitnessTracker
    dependencies:
      - package: FitDataProtocol
        product: FitDataProtocol
      - package: AntMessageProtocol
        product: AntMessageProtocol
      - package: FitnessUnits
        product: FitnessUnits
    info:
      path: FitnessTracker/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - bg
          - de
          - es
          - fr
          - it
          - nl
          - pt-PT
          - pl
          - sv
          - ja
          - da
          - nb
          - fi
          - cs
          - tr
          - ru
          - uk
          - ko
          - zh-Hans
          - pt-BR
          - ar
          - el
          - hu
          - ro
          - sk
          - sl
          - hr
          - sr
          - et
          - lv
          - lt
          - ca
          - is
          - sq
          - mk
          - ga
          - mt
          - zh-Hant
          - id
          - ms
          - vi
          - th
          - hi
          - he
          - gl
        # Reads passive metrics; writes back workouts imported from .fit files
        # and synced services, which is the only way Apple Health ever sees the
        # full-fidelity route and heart-rate series. No CoreLocation or
        # CoreMotion use — this app records nothing live, so it declares no
        # purpose string for APIs it never calls.
        NSHealthShareUsageDescription: "Import your resting heart rate, HRV, sleep, weight, and VO₂max to score training readiness."
        NSHealthUpdateUsageDescription: "Write workouts you import here back to Apple Health, with their route and heart-rate data intact."
        # Strava returns the OAuth code to this scheme.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.slavov.fitnesstracker.oauth
            CFBundleURLSchemes: [fitnesstracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slavov.fitnesstracker
        PRODUCT_NAME: FitnessTracker
        CODE_SIGN_ENTITLEMENTS: FitnessTracker/FitnessTracker.entitlements
        # HealthKit exists only on iOS; requesting the capability on macOS breaks
        # signing, so the iOS build gets its own entitlements file.
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: FitnessTracker/FitnessTracker-iOS.entitlements
        # XcodeGen writes CODE_SIGN_IDENTITY = "iPhone Developer" onto any target
        # that supports iOS, which outranks the project-level default, so the
        # ad-hoc override has to be repeated here.
        CODE_SIGN_IDENTITY: "-"
        # Turning on iCloud sync means adding the iCloud capability *and*
        # defining this flag, together. The entitlement alone makes the app
        # crash-free but local; the flag alone makes CloudKit abort the process
        # at launch for a missing entitlement. Neither is useful without the
        # other, so they live in the same file, next to each other.
        #   SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FITNESS_ICLOUD"
        GENERATE_INFOPLIST_FILE: NO

  FitnessTrackerTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: Tests
    dependencies:
      - target: FitnessTracker
      - package: FitDataProtocol
        product: FitDataProtocol
      - package: AntMessageProtocol
        product: AntMessageProtocol
      - package: FitnessUnits
        product: FitnessUnits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slavov.fitnesstracker.tests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen emits the iOS bundle layout; macOS nests the binary deeper.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FitnessTracker.app/Contents/MacOS/FitnessTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  FitnessTracker:
    build:
      targets:
        FitnessTracker: all
        FitnessTrackerTests: [test]
    test:
      targets:
        - FitnessTrackerTests
